# Include inside the tape4fun.com HTTPS server block (web build only).
location = /index.html {
    add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
}

# Old shared/bookmarked release pages now lead to the stable web URLs.
location ~ ^/releases/[a-f0-9]{64}/(en|zh-cn)/([^/]+\.html)$ {
    return 302 /$1/$2$is_args$args;
}
location ~ ^/releases/[a-f0-9]{64}/index\.html$ {
    return 302 /index.html$is_args$args;
}

location ~ ^/(en|zh-cn)/.*\.html$ {
    add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
}
location ~ ^/assets/[a-f0-9]{64}/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}
